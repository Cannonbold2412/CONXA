# ============================================================================
# Conxa — HOSTED DEV cloud tier (optional)
# ============================================================================
# A second Render service that fully mirrors production for end-to-end / integration
# testing of the real update endpoints, Clerk auth, and DB path — completely isolated
# from prod (its own service, its own database, the dev update channel).
#
# Deploy this ONLY when you want a hosted dev tier; the default dev workflow runs the
# backend locally (`make dev-backend`) with no infra. Apply with Render's blueprint,
# pointing it at this file instead of render.yaml.
#
# CONXA_ENV=dev keeps config on the dev lane. Auth can be ON here (a hosted dev tier
# runs a SEPARATE dev Clerk instance) — the config cross-check only forbids the
# reverse (prod with auth off), so dev-with-auth is allowed.
services:
  - type: web
    name: conxa-api-dev
    plan: free
    runtime: python
    rootDir: conxa-cloud/backend/
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      # The single switch — dev lane.
      - key: CONXA_ENV
        value: dev
      # Turn auth ON to exercise the real Clerk/JWT path end-to-end. Requires a
      # SEPARATE dev Clerk instance + the dev vars below. Set to false to run the
      # hosted tier auth-off (filesystem-like, unlimited dev plan) instead.
      - key: SKILL_AUTH_REQUIRED
        value: true
      - key: SKILL_API_BASE_URL
        value: https://dev-apis.conxa.in
      - key: SKILL_CORS_ORIGINS
        value: https://dev.conxa.in,http://localhost:3000
      # Dev Clerk instance (distinct from prod).
      - key: SKILL_CLERK_ISSUER
        sync: false
      - key: SKILL_CLERK_JWKS_URL
        sync: false
      - key: SKILL_CLERK_AUTHORIZED_PARTIES
        sync: false
      - key: SKILL_CLERK_AUDIENCE
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: SKILL_API_PROXY_SHARED_SECRET
        sync: false
      # Same server-side signing key family as prod (the runtime verifies dev and
      # stable manifests with the same baked-in public key). CI POSTs dev builds
      # here with CLOUD_ADMIN_TOKEN_DEV.
      - key: CONXA_MANIFEST_SIGNING_KEY
        sync: false
      - key: CONXA_ADMIN_TOKEN
        sync: false
      - key: SKILL_TRACKING_HMAC_SECRET
        sync: false
      # Cashfree SANDBOX in dev.
      - key: CASHFREE_ENV
        value: TEST
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_WEBHOOK_SECRET
        sync: false
      - key: CASHFREE_STARTER_PLAN_ID
        sync: false
      - key: CASHFREE_PRO_PLAN_ID
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: GOOGLE_AI_STUDIO_API_KEYS
        sync: false
      - key: NVIDIA_NIM_API_KEYS
        sync: false
      - key: SKILL_DATABASE_URL
        fromDatabase:
          name: conxa-db-dev
          property: connectionString

databases:
  - name: conxa-db-dev
    plan: free
    databaseName: conxa_dev
    user: conxa_dev
