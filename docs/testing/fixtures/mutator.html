<!doctype html>
<html><body>
<h1 id="title">Shapeshifter</h1>
<form onsubmit="event.preventDefault(); show();">
  <input id="f-name" placeholder="name" />
  <input id="f-email" placeholder="email" />
  <button type="button" id="tgt-go">Go</button>
</form>
<div id="out" hidden>Thanks, <span id="out-name"></span>!</div>
<script>
  // Every 700 ms: rewrite every id/class, move the button in the DOM,
  // and change its label — while keeping it clickable.
  //
  // The label/id vocabulary deliberately avoids "submit"/"confirm" and every entry in the
  // compiler's submit_text_tokens (sign in, log in, login, submit, continue, next, place order,
  // pay now, confirm — policy/default_policy.json). A target whose intent reads as a commit is
  // classified irreversible, and PROD-3 gives an irreversible step Layer 1 and NO re-resolution
  // at any tier (cascade.js) — so it can only ever fail closed, never heal. That makes it
  // useless as an H-1 drift target: this fixture exists to prove the runtime heals a renamed,
  // reclassed, relocated element, which requires a step recovery is allowed to re-resolve.
  const names = ['tgt-go','cta-go','act-send','do-it'];
  const labels = ['Go','Send','Do It','Proceed'];
  let i = 0;
  document.getElementById('tgt-go').addEventListener('click', e => {
    e.preventDefault();
    show();
  });
  setInterval(() => {
    i++;
    document.querySelectorAll('[id]').forEach((el, k) => {
      el.id = el.id.replace(/-(v\d+)?$/, '') + '-v' + i;
      el.className = 'c' + ((i + k) % 7) + ' mut-' + (i % 3);
    });
    const btn = document.getElementById(names[i % 4] + '-v' + i) ||
                document.querySelector('button');
    labels.forEach(l => { if (btn.textContent !== l && Math.random() < .25) btn.textContent = l; });
    document.body.appendChild(btn); // move button to end of body every tick
  }, 700);
  const outDiv = document.getElementById('out');
  const outName = document.getElementById('out-name');
  function show(){
    outDiv.hidden = false;
    outName.textContent =
      document.querySelector('input[placeholder="name"]').value;
  }
</script>
</body></html>
